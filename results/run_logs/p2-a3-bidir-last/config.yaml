run_name: p2-a3-bidir-last
model: allenai/OLMo-2-0425-1B
data: data/msmarco_cocondenser_50k.parquet
n_examples: 16000
pooling: last
bidirectional: true
instructions: true
instruction: Given a web search query, retrieve relevant passages that answer the
  query
max_len_query: 64
max_len_doc: 256
num_negatives: 3
temperature: 0.02
batch_size: 128
chunk_size: 32
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lr: 0.0001
weight_decay: 0.0
warmup_ratio: 0.05
max_grad_norm: 1.0
gradient_checkpointing: false
dtype: bfloat16
seed: 0
out_dir: runs
log_every: 5
save_every: 50
max_steps: 0
