[project]
name = "olmo3-embed"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.7",
  "transformers>=4.57",
  "peft",
  "sentence-transformers>=5",
  "mteb>=2",
  "datasets",
  "faiss-cpu",
  "pandas",
  "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olmo3_embed"]

