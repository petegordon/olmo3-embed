[project]
name = "olmo3-embed"
version = "0.0.1"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.7",
  "transformers>=4.57",
  "peft",
  "sentence-transformers>=5",
  "mteb>=2",
  "datasets",
  "faiss-cpu",
  "pandas",
  "pyyaml",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]
